<!-- popup.html -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>FocusFlow Stats</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="container">
      <h1>Today's Productivity</h1>
      <div class="stats">
        <div><span>Productive:</span> <strong id="prod"></strong></div>
        <div><span>Unproductive:</span> <strong id="unprod"></strong></div>
        <div><span>Total:</span> <strong id="total"></strong></div>
      </div>
      <div class="actions">
        <button id="openDashboard">View Dashboard</button>
        <button id="resetToday">Reset Today</button>
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
