<!-- options.html -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>FocusFlow Settings</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        padding: 16px;
      }
      h1 {
        margin-bottom: 8px;
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 16px;
      }
      textarea {
        width: 100%;
        height: 120px;
      }
      .row {
        margin: 12px 0;
      }
      label {
        display: block;
        margin-bottom: 6px;
        font-weight: 600;
      }
      button {
        padding: 8px 12px;
        border: 1px solid #ddd;
        border-radius: 6px;
        background: #fff;
        cursor: pointer;
      }
      button:hover {
        background: #f5f5f5;
      }
    </style>
  </head>
  <body>
    <h1>Classification Rules</h1>
    <p>Domains only (e.g., github.com). One per line.</p>
    <div class="grid">
      <div>
        <label>Productive</label>
        <textarea id="productive"></textarea>
      </div>
      <div>
        <label>Unproductive</label>
        <textarea id="unproductive"></textarea>
      </div>
      <div>
        <label>Neutral</label>
        <textarea id="neutral"></textarea>
      </div>
    </div>
    <div class="row">
      <label
        ><input type="checkbox" id="syncEnabled" /> Enable backend sync</label
      >
    </div>
    <div class="row">
      <label>Backend type</label>
      <select id="backendType">
        <option value="">None</option>
        <option value="firebase">Firebase Firestore</option>
        <option value="rest">Custom REST</option>
      </select>
    </div>
    <div class="row">
      <label>REST URL</label>
      <input
        type="text"
        id="restUrl"
        placeholder="https://api.example.com"
        style="width: 100%"
      />
    </div>
    <div class="row">
      <label>REST Token (optional)</label>
      <input
        type="text"
        id="restToken"
        placeholder="Bearer token"
        style="width: 100%"
      />
    </div>
    <button id="save">Save</button>

    <script src="options.js"></script>
  </body>
</html>
