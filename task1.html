<!DOCTYPE html>
<html>
  <head>
    <title>Weather App</title>
    <style>
      body {
        font-family: sans-serif;
        padding: 5;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: linear-gradient(to left, #e9b0e9, #fe00d4);
      }
      .container {
        background: #fff;
        padding: 20px;
        border-radius: 5px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        max-width: 400px;
        width: 100%;
        text-align: center;
      }
      input {
        padding: 20px;
        margin: 5px;
        width: 70%;
        border: 1px solid #ccc;
        border-radius: 5px;
      }
      button {
        padding: 10px;
        background: #4facfe;
        color: white;
        border-radius: 5px;
        cursor: pointer;
      }
      button:hover {
        background: #00c6ff;
      }
      .weatherDisplay {
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Weather Dashboard</h1>
      <div class="search-box">
        <input type="text" id="cityInput" placeholder="Enter Latitude" />
        <input type="text" id="longInput" placeholder="Enter Longitude" />
        <button id="fetchBtn">Get Weather</button>
      </div>
      <div id="weatherDisplay" class="weather-card">
        <p>Enter Latitude and Longitude to see the weather.</p>
      </div>
    </div>
    <script>
      document
        .getElementById("fetchBtn")
        .addEventListener("click", async () => {
          const lat = document.getElementById("cityInput").value;
          const lon = document.getElementById("longInput").value;
          const display = document.getElementById("weatherDisplay");

          if (!lat || !lon) {
            display.innerHTML = "Please enter both coordinates.";
            return;
          }

          try {
            display.innerHTML = "Loading...";

            // Fetch weather data
            const response = await fetch(
              `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`
            );
            if (!response.ok) throw new Error("Weather not found");
            const data = await response.json();
            const { temperature, windspeed } = data.current_weather;
            const geoResponse = await fetch(
              `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json`
            );
            const geoData = await geoResponse.json();
            const city =
              geoData.address.city ||
              geoData.address.town ||
              geoData.address.village ||
              "Unknown location";
            display.innerHTML = `<div class="result"> <h2>${temperature}°C</h2> <p>Wind Speed: ${windspeed} km/h</p> <p>CityName: ${city}</p> </div> `;
          } catch (error) {
            display.innerHTML = "Error due to: " + error.message;
          }
        });
    </script>
  </body>
</html>
